<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a0b0f"><title>NEULI Live 2.5D v0.3</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app">
<header class="top"><div class="brand"><span class="heart">♥</span><b>NEULI</b><small>LIVE 2.5D · LAYER RIG</small></div><div class="live"><i></i><span>LIVE</span></div></header>
<main>
<section class="stage" id="stage">
  <div class="scene scene-room" id="scene"></div><canvas id="avatar" aria-label="Haneul layered Live 2.5D avatar"></canvas><div class="grade"></div>
  <div class="avatar-meta"><strong>Haneul 하늘</strong><span id="stateLabel">載入分層角色…</span></div>
  <div class="hud"><span>LAYER 7</span><span id="yaw">YAW 0°</span><span id="pitch">PITCH 0°</span><span id="viseme">VISEME —</span><span id="fps">60 FPS</span></div>
</section>
<section class="chat-panel">
  <div class="conversation" id="conversation"><div class="bubble her">嗨。v0.3 已把眼睛、閉眼層、嘴唇和前髮拆成獨立控制層，不再只扭曲整張人物圖。</div></div>
  <div class="quick"><button data-action="smile">微笑</button><button data-action="blink">眨眼</button><button data-action="talk">說一句</button><button data-action="reset">自然</button></div>
  <div class="composer"><button id="mic" class="round" aria-label="語音輸入">🎙</button><input id="input" placeholder="跟她說話…" autocomplete="off"><button id="send" class="round send">↑</button></div>
</section>
<button id="settings" class="settings" aria-label="設定">⚙</button>
<aside class="drawer" id="drawer"><div class="drawer-head"><strong>Layer Live Rig</strong><button id="close">×</button></div>
  <label>頭部跟隨 <output id="headOut">68%</output><input id="head" type="range" min="0" max="100" value="68"></label>
  <label>視線跟隨 <output id="gazeOut">75%</output><input id="gaze" type="range" min="0" max="100" value="75"></label>
  <label>嘴型強度 <output id="lipOut">82%</output><input id="lip" type="range" min="0" max="100" value="82"></label>
  <label>呼吸動作 <output id="breathOut">52%</output><input id="breath" type="range" min="0" max="100" value="52"></label>
  <label>前髮擺動 <output id="hairOut">46%</output><input id="hair" type="range" min="0" max="100" value="46"></label>
  <div class="scene-buttons"><button data-scene="room" class="active">房間</button><button data-scene="night">夜景</button><button data-scene="cafe">咖啡廳</button></div>
  <p>分層：Base、左右眼、左右閉眼層、嘴唇、前髮。眼口底層已補平；眨眼改用專用閉眼貼層交叉淡入，避免壓縮眼睛造成鬼影。</p>
</aside>
</main></div><script type="module" src="/app.js"></script></body></html>
